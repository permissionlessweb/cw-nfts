[workspace]
members  = ["contracts/*", "packages/*"]
resolver = "2"

[workspace.package]
documentation = "https://docs.cosmwasm.com"
edition       = "2021"
homepage      = "https://cosmwasm.com"
license       = "Apache-2.0"
repository    = "https://github.com/CosmWasm/cw-nfts"
rust-version  = "1.86"
version       = "0.22.0"

[workspace.dependencies]
anyhow          = "^1.0"
bech32          = "^0.11"
cosmwasm-schema = { version = "=4.1.0" }
cosmwasm-std = { version = "=4.1.0" }
cw-multi-test = { package = "abstract-cw-multi-test", version = "=3.0.0-rc" }
cw-ownable = { version = "3.0.1" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { version = "3.0.0" }
cw2 = { version = "3.0.0" }
cw20 = { version = "3.0.0" }
cw721 = { path = "packages/cw721" }
cw721-base = { path = "contracts/cw721-base" }
schemars = "0.8.22"
serde = { version = "^1.0", default-features = false, features = ["derive"] }
sha2 = "^0.10"
thiserror = "^1.0"
url = "^2.5"
[patch.crates-io]

abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", rev = "2eb14e1f0b66caed897a3c4a69a4c57282b565c0" }
cw-ownable = { git = "https://github.com/permissionlessweb/cw-plus-plus", rev = "2fa6fe3fdf5f0c929a0e3b504320ead4a0553c05" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "b303f445113c95427b57fc825bc033fdf3e6fee0" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cw20-ics20 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
[profile.release]
debug            = false
debug-assertions = false
lto              = true
opt-level        = "s"
overflow-checks  = true
rpath            = false

[profile.release.package.cw721-base]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-expiration]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-metadata-onchain]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-fixed-price]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-non-transferable]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-receiver-tester]
codegen-units = 1
incremental   = false

[profile.release.package.cw2981-royalties]
codegen-units = 1
incremental   = false
