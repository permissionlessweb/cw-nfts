[workspace]
members  = ["contracts/*", "packages/*"]
resolver = "2"

[workspace.package]
documentation = "https://docs.cosmwasm.com"
edition       = "2021"
homepage      = "https://cosmwasm.com"
license       = "Apache-2.0"
repository    = "https://github.com/CosmWasm/cw-nfts"
rust-version  = "1.86"
version       = "0.22.0"

[workspace.dependencies]
anyhow          = "^1.0"
bech32          = "^0.11"
cosmwasm-schema = { version = "=4.0.0-zk" }
cosmwasm-std = { version = "=4.0.0-zk" }
cw-multi-test = { package = "abstract-cw-multi-test", version = "=3.0.0-rc" }
cw-ownable = { version = "3.0.1" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { version = "3.0.0" }
cw2 = { version = "3.0.0" }
cw20 = { version = "3.0.0" }
cw721 = { path = "packages/cw721" }
cw721-base = { path = "contracts/cw721-base" }
schemars = "0.8.22"
serde = { version = "^1.0", default-features = false, features = ["derive"] }
sha2 = "^0.10"
thiserror = "^1.0"
url = "^2.5"
[patch.crates-io]

abstract-cw-multi-test = { path = "../cw-multi-test-fork" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw20 = { path = "../cw-plus/packages/cw20" }

cw20-ics20 = { path = "../cw-plus/contracts/cw20-ics20" }
cw-controllers = { path = "../cw-minus/packages/controllers" }
[profile.release]
debug            = false
debug-assertions = false
lto              = true
opt-level        = "s"
overflow-checks  = true
rpath            = false

[profile.release.package.cw721-base]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-expiration]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-metadata-onchain]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-fixed-price]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-non-transferable]
codegen-units = 1
incremental   = false

[profile.release.package.cw721-receiver-tester]
codegen-units = 1
incremental   = false

[profile.release.package.cw2981-royalties]
codegen-units = 1
incremental   = false
